
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Root5 Governance DAO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Root5 DAO colors from app.root5dao.com */
            --color-background: #020202;
            --color-primary-purple: #6a3bdb; /* rgb(106, 59, 219) */
            --color-primary-purple-dark: #5a2ed1; /* Slightly darker for hover */
            --color-secondary-blue: #38aced; /* rgb(56, 172, 237) */
            --color-secondary-blue-dark: #2f9cdb; /* Slightly darker for hover */
            --color-accent-green: #34d399; /* Vibrant green */
            --color-accent-red: #ef4444;   /* Standard red */
            --color-accent-cyan: #06b6d4;  /* Existing cyan, fits well */
            --color-accent-orange: #f7931a; /* Orange from squads, good for Jupiter */
            --color-accent-light-purple: #9775fa; /* Light purple, good for Pyth */
            --color-accent-yellow-orange: #fab005; /* Yellow-orange, good for Bonk */


            /* Text opacities */
            --color-text-white-full: #ffffff;
            --color-text-white-80: rgba(255, 255, 255, 0.85); /* Slightly less opaque white for clarity */
            --color-text-white-60: rgba(255, 255, 255, 0.65); /* Light grey */
            --color-text-white-40: rgba(255, 255, 255, 0.4);  /* Medium grey */
            --color-text-white-30: rgba(255, 255, 255, 0.3);  /* Dark grey */

            /* Borders and dividers */
            --color-border-light: rgba(255, 255, 255, 0.08);
            --color-border-medium: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-background);
            color: var(--color-text-white-full);
            margin: 0;
            overflow-x: hidden;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-text-white-40);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-text-white-60);
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid var(--color-border-light);
        }
        .neon-border { /* Adjusted for new purple */
            border: 1px solid rgba(106, 59, 219, 0.4);
            box-shadow: 0 0 15px rgba(106, 59, 219, 0.1);
        }
        .gradient-text { /* Adjusted for new purple and blue */
            background: linear-gradient(135deg, var(--color-primary-purple) 0%, var(--color-secondary-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Tailwind overrides using CSS variables */
        .bg-purple-600 { background-color: var(--color-primary-purple); }
        .hover\:bg-purple-700:hover { background-color: var(--color-primary-purple-dark); }
        .text-purple-400 { color: var(--color-primary-purple); }
        .shadow-purple-600\/20 { box-shadow: 0 10px 15px -3px rgba(106, 59, 219, 0.2), 0 4px 6px -2px rgba(106, 59, 219, 0.1); }
        .bg-blue-600 { background-color: var(--color-secondary-blue); }
        .hover\:bg-blue-700:hover { background-color: var(--color-secondary-blue-dark); }
        .text-blue-400 { color: var(--color-secondary-blue); }
        
        /* Green/Red accents */
        .bg-green-500\/20 { background-color: rgba(52, 211, 153, 0.2); } /* var(--color-accent-green)/20 */
        .text-green-400 { color: var(--color-accent-green); }
        .h-full.bg-green-500 { background-color: var(--color-accent-green); }

        .bg-red-500\/20 { background-color: rgba(239, 68, 68, 0.2); } /* var(--color-accent-red)/20 */
        .text-red-400 { color: var(--color-accent-red); }
        .h-full.bg-red-500 { background-color: var(--color-accent-red); }

        /* Text opacities for consistency */
        .text-white\/80 { color: var(--color-text-white-80); }
        .text-white\/60 { color: var(--color-text-white-60); }
        .text-white\/50 { color: var(--color-text-white-60); } /* Mapping 50% to 60% for consistency with root5dao.com */
        .text-white\/40 { color: var(--color-text-white-40); }
        .text-white\/30 { color: var(--color-text-white-30); }
        .text-white\/20 { color: var(--color-text-white-30); } /* Mapping 20% to 30% for consistency */

        /* Border opacities */
        .border-white\/5 { border-color: var(--color-border-light); }
        .border-white\/10 { border-color: var(--color-border-medium); }
        .hover\:border-white\/20:hover { border-color: var(--color-border-medium); }

    </style>
<script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
